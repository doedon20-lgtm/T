<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEBBIE — Wear Confidence, Define Your Style</title>
  <style>
    :root {
      --bg-color: #d8004f;
      --bg-glow: rgba(255, 72, 136, 0.42);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.82);
      --pill-border: rgba(255, 255, 255, 0.72);
      --pill-active-bg: #ffffff;
      --pill-active-text: #141416;
      --transition-speed: 650ms;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(circle at 52% 48%, var(--bg-glow) 0%, transparent 56%),
        radial-gradient(circle at 18% 85%, rgba(0, 0, 0, 0.14) 0%, transparent 45%);
      color: var(--text-main);
      transition: background-color var(--transition-speed) cubic-bezier(0.22, 1, 0.36, 1),
                  color var(--transition-speed) ease;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 48px 28px;
    }

    /* Top Navigation */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      z-index: 5;
    }

    .brand-mark {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      text-decoration: none;
      color: inherit;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .brand-mark svg {
      width: 28px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 13px;
      font-weight: 500;
    }

    nav a {
      color: inherit;
      text-decoration: none;
      opacity: 0.85;
      padding-bottom: 3px;
      border-bottom: 1.5px solid transparent;
      transition: opacity 0.2s ease, border-color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      opacity: 1;
      border-bottom-color: currentColor;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 4px;
      opacity: 0.9;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .icon-btn:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .bag-count {
      position: absolute;
      top: -3px;
      right: -6px;
      font-size: 10px;
      font-weight: 700;
      background: currentColor;
      color: var(--bg-color);
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* Main Stage Grid */
    .stage {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 460px) 1fr;
      align-items: center;
      gap: 24px;
      margin: auto 0;
      padding: 20px 0;
      position: relative;
    }

    /* Left Column */
    .hero-copy {
      max-width: 340px;
      justify-self: start;
    }

    .hero-copy h1 {
      font-size: clamp(2.1rem, 3.6vw, 3.35rem);
      line-height: 1.06;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .hero-copy p {
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .cta-btn {
      background: transparent;
      color: inherit;
      border: 1px solid var(--pill-border);
      padding: 9px 18px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .cta-btn:hover {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      transform: translateY(-1px);
    }

    /* Center Garment Stage + Arrows */
    .center-showcase {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .carousel-row {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .arrow-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--pill-border);
      background: rgba(255, 255, 255, 0.08);
      color: inherit;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, background-color 0.2s ease;
      z-index: 4;
    }

    .arrow-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.06);
    }

    .garment-frame {
      position: relative;
      width: 310px;
      height: 360px;
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: pan-y;
    }

    .garment-visual {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
      filter: drop-shadow(0 28px 34px rgba(0, 0, 0, 0.28));
    }

    .garment-visual.swiping-next {
      opacity: 0;
      transform: translateX(-48px) scale(0.95);
    }

    .garment-visual.swiping-prev {
      opacity: 0;
      transform: translateX(48px) scale(0.95);
    }

    .garment-visual svg {
      width: 280px;
      height: 330px;
      overflow: visible;
    }

    .tagline-center {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 500;
      opacity: 0.92;
    }

    /* Right Column: Price & Sizes */
    .meta-panel {
      justify-self: end;
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 14px;
    }

    .price-current {
      font-size: clamp(1.45rem, 2.2vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .price-compare {
      font-size: 14px;
      opacity: 0.72;
      margin-top: -8px;
    }

    .size-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .size-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .size-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--pill-border);
      background: transparent;
      color: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }

    .size-btn:hover {
      transform: scale(1.06);
    }

    .size-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: var(--pill-active-bg);
    }

    /* Footer */
    footer {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding-top: 12px;
      position: relative;
    }

    .socials {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
    }

    .socials a {
      color: inherit;
      text-decoration: none;
      opacity: 0.85;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .socials a:hover {
      opacity: 1;
      transform: translateY(-2px);
    }

    .next-preview-btn {
      width: 72px;
      height: 76px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.22s ease, background-color 0.22s ease;
    }

    .next-preview-btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: rgba(255, 255, 255, 0.2);
    }

    .next-preview-btn svg {
      width: 54px;
      height: 60px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #141416;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 20;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      body {
        padding: 18px 20px 22px;
      }

      nav {
        display: none;
      }

      .stage {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 18px;
      }

      .hero-copy,
      .meta-panel {
        justify-self: center;
        align-items: center;
        text-align: center;
      }

      .size-list {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand-mark" aria-label="DEBBIE Home">
      <svg viewBox="0 0 40 24">
        <path d="M20 4 C20 2.3 21.5 1 23 1 C24.3 1 25.2 1.9 25.2 3.1 C25.2 4.4 23.7 5.2 20 6.8 L4 16.5 C2.5 17.4 3 19.5 4.8 19.5 L35.2 19.5 C37 19.5 37.5 17.4 36 16.5 L20 6.8 Z" />
      </svg>
      <span>DEBBIE</span>
    </a>

    <nav>
      <a href="#home">Home</a>
      <a href="#tshirt" class="active">T-Shirt</a>
      <a href="#hoodies">Hoodies</a>
      <a href="#sweatshirts">Sweatshirts</a>
      <a href="#about">About Us</a>
    </nav>

    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>
      <button class="icon-btn" id="accountBtn" aria-label="Account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21a8 8 0 0 0-16 0" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </button>
      <button class="icon-btn" id="bagBtn" aria-label="Shopping Bag">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <path d="M16 10a4 4 0 0 1-8 0" />
        </svg>
        <span class="bag-count" id="bagCount">1</span>
      </button>
    </div>
  </header>

  <main class="stage">
    <section class="hero-copy">
      <h1>Wear Confidence<br />Define Your Style.</h1>
      <p>Discover premium T-shirts, hoodies, and sweatshirts designed for comfort, quality, and everyday expression.</p>
      <button class="cta-btn" id="getLookBtn">Get the look</button>
    </section>

    <section class="center-showcase">
      <div class="carousel-row">
        <button class="arrow-btn" id="prevBtn" aria-label="Previous colorway">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>

        <div class="garment-frame" id="swipeStage">
          <div class="garment-visual" id="garmentVisual"></div>
        </div>

        <button class="arrow-btn" id="nextBtn" aria-label="Next colorway">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <polyline points="9 18 15 12 9 6" />
          </svg>
        </button>
      </div>

      <div class="tagline-center">Dress Better.<br />Feel Better.</div>
    </section>

    <aside class="meta-panel">
      <div class="price-current" id="priceCurrent">₦10,000</div>
      <div class="price-compare" id="priceCompare">₦15,000</div>
      <div class="size-label">Choose your size</div>
      <div class="size-list" id="sizeList">
        <button class="size-btn" data-size="XS">XS</button>
        <button class="size-btn" data-size="SM">SM</button>
        <button class="size-btn active" data-size="MD">MD</button>
        <button class="size-btn" data-size="LG">LG</button>
        <button class="size-btn" data-size="XL">XL</button>
      </div>
    </aside>
  </main>

  <footer>
    <div class="socials" aria-label="Social links">
      <a href="#instagram" title="Instagram">IG</a>
      <a href="#x" title="X">𝕏</a>
      <a href="#pinterest" title="Pinterest">P</a>
      <a href="#youtube" title="YouTube">▶</a>
      <a href="#tiktok" title="TikTok">♪</a>
    </div>

    <button class="next-preview-btn" id="previewJumpBtn" aria-label="Jump to next colorway" title="Next colorway">
      <span id="nextThumbHolder"></span>
    </button>
  </footer>

  <div class="toast" id="toast"></div>

  <script>
    const SLIDES = [
      {
        name: "Crimson Rose Tee",
        bg: "#d8004f",
        glow: "rgba(255, 86, 146, 0.45)",
        textMain: "#ffffff",
        textMuted: "rgba(255, 255, 255, 0.84)",
        pillBorder: "rgba(255, 255, 255, 0.72)",
        pillActiveBg: "#ffffff",
        pillActiveText: "#161618",
        shirtFill: "#e41b66",
        shirtShade: "#b30948",
        shirtHighlight: "#ff5c96",
        hangerColor: "#ffffff",
        price: "₦10,000",
        compare: "₦15,000"
      },
      {
        name: "Pure Cloud Tee",
        bg: "#dedfe1",
        glow: "rgba(255, 255, 255, 0.65)",
        textMain: "#1c1c1e",
        textMuted: "rgba(28, 28, 30, 0.74)",
        pillBorder: "rgba(28, 28, 30, 0.55)",
        pillActiveBg: "#1c1c1e",
        pillActiveText: "#ffffff",
        shirtFill: "#f7f8fa",
        shirtShade: "#cfd2d8",
        shirtHighlight: "#ffffff",
        hangerColor: "#7e828a",
        price: "₦10,000",
        compare: "₦15,000"
      },
      {
        name: "Espresso Clay Tee",
        bg: "#7f6344",
        glow: "rgba(232, 206, 150, 0.35)",
        textMain: "#f4efe6",
        textMuted: "rgba(244, 239, 230, 0.8)",
        pillBorder: "rgba(244, 239, 230, 0.68)",
        pillActiveBg: "#f4efe6",
        pillActiveText: "#3c2b1a",
        shirtFill: "#5a4636",
        shirtShade: "#3d2f24",
        shirtHighlight: "#78604c",
        hangerColor: "#e6dec8",
        price: "₦10,000",
        compare: "₦15,000"
      },
      {
        name: "Obsidian Onyx Tee",
        bg: "#cfc8b4",
        glow: "rgba(255, 250, 232, 0.45)",
        textMain: "#1d1d1f",
        textMuted: "rgba(29, 29, 31, 0.75)",
        pillBorder: "rgba(29, 29, 31, 0.55)",
        pillActiveBg: "#1d1d1f",
        pillActiveText: "#f5f2ea",
        shirtFill: "#232427",
        shirtShade: "#121315",
        shirtHighlight: "#3a3c42",
        hangerColor: "#5b5850",
        price: "₦10,000",
        compare: "₦15,000"
      }
    ];

    let currentIndex = 0;
    let selectedSize = "MD";
    let bagItems = 1;
    let pointerStartX = null;

    const root = document.documentElement;
    const garmentVisual = document.getElementById("garmentVisual");
    const priceCurrent = document.getElementById("priceCurrent");
    const priceCompare = document.getElementById("priceCompare");
    const nextThumbHolder = document.getElementById("nextThumbHolder");
    const bagCount = document.getElementById("bagCount");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toast.classList.remove("show"), 2000);
    }

    function renderTeeSVG(slide, compact = false) {
      return `
        <svg viewBox="0 0 260 310" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="teeGrad-${slide.name.replace(/\s+/g, '')}-${compact ? 'sm' : 'lg'}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="${slide.shirtHighlight}" />
              <stop offset="52%" stop-color="${slide.shirtFill}" />
              <stop offset="100%" stop-color="${slide.shirtShade}" />
            </linearGradient>
          </defs>
          ${compact ? "" : `
          <g stroke="${slide.hangerColor}" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
            <path d="M130 22 C130 14 137 10 142 14 C145 16.5 144 21 139 23.5 L130 28" />
            <path d="M130 28 L46 72 C41 75 43 82 49 82 L211 82 C217 82 219 75 214 72 Z" />
          </g>`}
          <path
            d="M96 76
               Q130 98 164 76
               L226 106
               L202 156
               L176 144
               L176 286
               Q130 293 84 286
               L84 144
               L58 156
               L34 106
               Z"
            fill="url(#teeGrad-${slide.name.replace(/\s+/g, '')}-${compact ? 'sm' : 'lg'})"
          />
          <path
            d="M96 76 Q130 98 164 76"
            fill="none"
            stroke="${slide.shirtShade}"
            stroke-width="2.4"
            opacity="0.55"
          />
          <path d="M84 144 L88 112" stroke="${slide.shirtShade}" stroke-width="1.5" opacity="0.35" fill="none" />
          <path d="M176 144 L172 112" stroke="${slide.shirtShade}" stroke-width="1.5" opacity="0.35" fill="none" />
          <circle cx="130" cy="116" r="2.2" fill="${slide.hangerColor}" opacity="0.7" />
        </svg>
      `;
    }

    function applySlide(index, direction = "next") {
      const animClass = direction === "prev" ? "swiping-prev" : "swiping-next";
      garmentVisual.classList.add(animClass);

      setTimeout(() => {
        currentIndex = (index + SLIDES.length) % SLIDES.length;
        const slide = SLIDES[currentIndex];
        const nextSlide = SLIDES[(currentIndex + 1) % SLIDES.length];

        root.style.setProperty("--bg-color", slide.bg);
        root.style.setProperty("--bg-glow", slide.glow);
        root.style.setProperty("--text-main", slide.textMain);
        root.style.setProperty("--text-muted", slide.textMuted);
        root.style.setProperty("--pill-border", slide.pillBorder);
        root.style.setProperty("--pill-active-bg", slide.pillActiveBg);
        root.style.setProperty("--pill-active-text", slide.pillActiveText);

        garmentVisual.innerHTML = renderTeeSVG(slide, false);
        priceCurrent.textContent = slide.price;
        priceCompare.textContent = slide.compare;
        nextThumbHolder.innerHTML = renderTeeSVG(nextSlide, true);

        garmentVisual.classList.remove("swiping-next", "swiping-prev");
      }, 170);
    }

    document.getElementById("nextBtn").addEventListener("click", () => applySlide(currentIndex + 1, "next"));
    document.getElementById("prevBtn").addEventListener("click", () => applySlide(currentIndex - 1, "prev"));
    document.getElementById("previewJumpBtn").addEventListener("click", () => applySlide(currentIndex + 1, "next"));

    const swipeStage = document.getElementById("swipeStage");
    swipeStage.addEventListener("pointerdown", (e) => {
      pointerStartX = e.clientX;
    });
    swipeStage.addEventListener("pointerup", (e) => {
      if (pointerStartX === null) return;
      const diff = e.clientX - pointerStartX;
      if (Math.abs(diff) > 36) {
        if (diff < 0) applySlide(currentIndex + 1, "next");
        else applySlide(currentIndex - 1, "prev");
      }
      pointerStartX = null;
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") applySlide(currentIndex + 1, "next");
      if (e.key === "ArrowLeft") applySlide(currentIndex - 1, "prev");
    });

    document.querySelectorAll(".size-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedSize = btn.dataset.size;
        showToast(`Selected size ${selectedSize}`);
      });
    });

    document.getElementById("getLookBtn").addEventListener("click", () => {
      bagItems += 1;
      bagCount.textContent = bagItems;
      showToast(`Added ${SLIDES[currentIndex].name} (${selectedSize}) to bag`);
    });

    document.getElementById("bagBtn").addEventListener("click", () => {
      showToast(`Bag has ${bagItems} item(s) — active: ${SLIDES[currentIndex].name} (${selectedSize})`);
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      showToast("Search: T-Shirts, Hoodies, Sweatshirts");
    });

    document.getElementById("accountBtn").addEventListener("click", () => {
      showToast("DEBBIE Member Account Ready");
    });

    // Initial render
    const initialSlide = SLIDES[0];
    root.style.setProperty("--bg-color", initialSlide.bg);
    root.style.setProperty("--bg-glow", initialSlide.glow);
    garmentVisual.innerHTML = renderTeeSVG(initialSlide, false);
    nextThumbHolder.innerHTML = renderTeeSVG(SLIDES[1], true);
  </script>
</body>
</html>
